name: Validate Firefox companion
on:
  pull_request:
  push:
    branches: [main, feature/workspace-hub-alpha]
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local tests and JavaScript syntax
        run: npm test
      - name: Verify on-device preflight script syntax
        run: bash -n scripts/run-local-firefox-preflight.sh
      - name: Build unsigned development extension
        run: npm run package
      - name: Check XPI contents and manifest
        run: python3 -c "import json,zipfile; z=zipfile.ZipFile('dist/workspace-ai-alpha-unsigned.xpi'); m=json.loads(z.read('manifest.json')); assert m['manifest_version']==3; assert 'hub.html' in z.namelist(); print('Package integrity OK')"
      - name: Candidate integrity and release gate tests
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          python3 scripts/release_preflight.py --tag "$TAG"
          python3 -m unittest discover -s tests -p 'test_release_preflight.py'
          python3 -m unittest discover -s tests -p 'test_docs_status.py'
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-ai-alpha-unsigned
          path: dist/workspace-ai-alpha-unsigned.xpi
