name: Native Firefox Workspace acceptance
on:
  pull_request:
  push:
    branches: [qa/native-firefox-super-tab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated browser extension
        run: |
          npm test
          npm run package
      - name: Mozilla Add-ons lint
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/extension --warnings-as-errors
      - name: Install release Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.52,<5'
      - name: Native Firefox headless tab orchestration
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 tests/native_firefox.py
      - name: Publish isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ai-firefox-qa
          path: dist/native-firefox/
          if-no-files-found: warn

  integrated-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ELF//SHELL core assistant integration branch
        uses: actions/checkout@v4
        with:
          repository: cryogenized-spec/elf-shell-ayarime
          ref: feature/ask-ayarime-entry-056
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test both independent unsigned add-ons
        run: |
          npm test
          npm run package
          (cd core && npm test)
          python3 core/scripts/package.py
      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.30,<5'
      - name: Run two-extension command acceptance
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: python3 tests/native_bridge.py
      - name: Upload two-extension acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-core-integration-qa
          path: dist/native-bridge/
          if-no-files-found: warn
